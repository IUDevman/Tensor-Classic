plugins {
    id "babric-loom" version "1.5-SNAPSHOT"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

loom {
    gluedMinecraftJar()
    customMinecraftManifest.set("https://babric.github.io/manifest-polyfill/${minecraft_version}.json")
    intermediaryUrl.set("https://maven.glass-launcher.net/babric/babric/intermediary/%1\$s/intermediary-%1\$s-v2.jar")
}

repositories {
    maven {
        name = "Babric"
        url = "https://maven.glass-launcher.net/babric"
    }
    maven {
        name = "FDD Maven"
        url = "https://maven.firstdark.dev/releases"
    }
    maven {
        url = "https://jitpack.io"
    }
    maven {
        url = "https://github.com/FreeCliff/maven/raw/master"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.wksh:mcp:b1.7.3-release"
    modImplementation "babric:fabric-loader:${project.loader_version}"

    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.16.0"
    implementation "com.google.code.gson:gson:2.13.2"

    implementation "com.github.jasypt:jasypt:jasypt-1.9.3"
    shadow "com.github.jasypt:jasypt:jasypt-1.9.3"

    implementation "dev.firstdark.discordrpc:discord-rpc:1.0.4:legacy"
    shadow "dev.firstdark.discordrpc:discord-rpc:1.0.4:legacy"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    exclude("META-INF")
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}.txt" }
    }
}

remapJar {
    dependsOn(shadowJar)
    mustRunAfter(shadowJar)
    inputFile = file(shadowJar.archivePath)
}